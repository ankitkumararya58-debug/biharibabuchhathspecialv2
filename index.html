header{text-align:center}
h1{
  font-family:"Yatra One","Poppins",serif;
  font-weight:400;
  font-size:clamp(3rem,16vw,4.4rem);
  line-height:1.02;
  color:#fff;
  text-wrap:balance;
  text-shadow:0 2px 0 rgba(8,30,70,.35),0 6px 26px rgba(4,20,56,.6);
}
.greeting{
  margin:18px auto 0;
  max-width:28ch;
  font-size:.95rem;
  font-weight:500;
  line-height:1.55;
  text-wrap:balance;
  text-shadow:0 1px 10px rgba(4,20,56,.75),0 0 2px rgba(4,20,56,.6);
}
.spacer{flex:1;min-height:36vh}

/* Player */
.player{
  background:var(--glass);
  border:1px solid var(--glass-line);
  border-radius:28px;
  padding:14px 16px 16px;
  backdrop-filter:blur(18px) saturate(1.2);
  -webkit-backdrop-filter:blur(18px) saturate(1.2);
  box-shadow:0 18px 40px rgba(0,0,0,.35);
}
.now{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center}
.thumb{
  width:56px;height:56px;border-radius:50%;object-fit:cover;
  background:linear-gradient(135deg,#f4b02a,#c2410c);
  border:2px solid rgba(255,236,200,.25);
}
.meta{min-width:0}
.title{
  font-size:.92rem;font-weight:600;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.author{font-size:.74rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{
  appearance:none;border:0;cursor:pointer;color:var(--ink);
  width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.1);
  display:grid;place-items:center;
  transition:background .15s,transform .1s;
}
.icon-btn:active{transform:scale(.93)}
.icon-btn svg{width:18px;height:18px;fill:currentColor}
.progress{margin-top:14px}
.bar{
  position:relative;height:18px;display:flex;align-items:center;cursor:pointer;touch-action:none;
}
.bar::before{content:"";position:absolute;left:0;right:0;height:4px;border-radius:4px;background:rgba(255,255,255,.2)}
.fill{position:absolute;left:0;height:4px;border-radius:4px;background:var(--amber);width:0}
.times{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.controls{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:10px}
.play{
  width:60px;height:60px;
  background:var(--amber);color:#1b1004;
  box-shadow:0 6px 18px rgba(244,176,42,.35);
}
.play svg{width:24px;height:24px}
.play .i-pause{display:none}
.is-playing .play .i-play{display:none}
.is-playing .play .i-pause{display:block}
.mute .i-off{display:none}
.is-muted .mute .i-on{display:none}
.is-muted .mute .i-off{display:block}
.hint{font-size:.74rem;color:var(--muted);text-align:center;margin-top:10px;min-height:1.2em}

footer{
  text-align:center;margin-top:14px;
  font-size:.74rem;color:var(--muted);
  text-shadow:0 1px 6px rgba(0,0,0,.6);
}
footer a{color:var(--ink);text-decoration:none;border-bottom:1px solid rgba(255,247,234,.4)}
footer .sep{margin:0 8px;opacity:.5}

:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.icon-btn:hover{background:rgba(255,255,255,.18)}
.play:hover{background:#ffc247}

/* Hidden YouTube engine (kept in layout so mobile browsers keep it alive) */
#yt-wrap{position:fixed;right:0;bottom:0;width:200px;height:200px;opacity:.01;pointer-events:none;z-index:-2}
#yt-wrap iframe{width:200px;height:200px}
</style>

        album:"Bihari babu",
        artwork:[
          {src:"https://i.ytimg.com/vi/"+d.video_id+"/mqdefault.jpg",sizes:"320x180",type:"image/jpeg"},
          {src:"https://i.ytimg.com/vi/"+d.video_id+"/hqdefault.jpg",sizes:"480x360",type:"image/jpeg"}
        ]
      });
    }catch(_){}
  }
  function updateMediaPosition(){
    if(!mediaSession || !ready || !mediaSession.setPositionState)return;
    try{
      var duration=player.getDuration(), position=player.getCurrentTime();
      if(Number.isFinite(duration)&&duration>0&&Number.isFinite(position)){
        mediaSession.setPositionState({duration:duration,playbackRate:1,position:Math.min(position,duration)});
      }
    }catch(_){}
  }
  setupMediaSession();

  var isWeb=/^https?:$/.test(location.protocol);
  if(!isWeb){setHint("Music works only from a hosted link (https://). Upload this page to a host like Netlify or GitHub Pages.")}
  var readyTimer=setTimeout(function(){
    if(!ready)setHint("Music player is not loading. Check your internet and that the page is opened from an https:// link.");
  },8000);

  var tag=document.createElement("script");
  tag.src="https://www.youtube.com/iframe_api";
  tag.onerror=function(){setHint("Could not load the music player. Check your connection.")};
  document.head.appendChild(tag);

  window.onYouTubeIframeAPIReady=function(){
    player=new YT.Player("yt",{
      height:"200",width:"200",
      playerVars:Object.assign({listType:"playlist",list:PLAYLIST_ID,playsinline:1,controls:0,rel:0,modestbranding:1,iv_load_policy:3},isWeb?{origin:location.origin}:{}),
      events:{onReady:onReady,onStateChange:onState,onError:onError}
    });
  };

  function onReady(){ready=true;clearTimeout(readyTimer);if(isWeb)setHint("");syncMeta();setInterval(tick,500)}

  function onState(e){
    var S=YT.PlayerState;
    var playing=(e.data===S.PLAYING||e.data===S.BUFFERING);
    app.classList.toggle("is-playing",playing);
    playBtn.setAttribute("aria-label",playing?"Pause":"Play");
    if(e.data===S.PLAYING){errorCount=0;setHint("")}
    setMediaPlaybackState(e.data===S.PLAYING?"playing":(e.data===S.PAUSED?"paused":"none"));
    syncMeta();
  }

  function onError(e){
    var code=e&&e.data;
    setMediaPlaybackState("none");
    // 150/101/153: embedding blocked or no valid web origin. 100: removed/private. 2: bad playlist id.
    if(code===153||!isWeb){setHint("YouTube blocked playback (error "+code+"). Open this page from a hosted https:// link.");return}
    errorCount++;
    if(errorCount>5){setHint("These videos can't be played right now (error "+code+").");return}
    setHint("Skipping a song that can't be played…");
    try{player.nextVideo()}catch(_){}
  }

  function syncMeta(){
    if(!ready)return;
    var d=player.getVideoData?player.getVideoData():null;
    if(!d||!d.video_id)return;
    if(d.video_id!==lastVideo){
      lastVideo=d.video_id;
      thumb.src="https://i.ytimg.com/vi/"+d.video_id+"/mqdefault.jpg";
      titleEl.textContent=d.title||"";
      authorEl.textContent=d.author||"";
    }else if(d.title&&titleEl.textContent!==d.title){
      titleEl.textContent=d.title;authorEl.textContent=d.author||"";
    }
    updateMediaMetadata(d);
    updateMediaPosition();
  }

  function tick(){
    if(!ready)return;
    var t=player.getCurrentTime?player.getCurrentTime():0;
    var d=player.getDuration?player.getDuration():0;
    cur.textContent=fmt(t);
    dur.textContent=fmt(d);
    var pct=d>0?Math.min(100,t/d*100):0;
    fill.style.width=pct+"%";
    bar.setAttribute("aria-valuenow",Math.round(pct));
    updateMediaPosition();
    syncMeta();
  }

  playBtn.addEventListener("click",function(){
    if(!ready){setHint("Player is still loading…");return}
    var st=player.getPlayerState();
    if(st===YT.PlayerState.PLAYING||st===YT.PlayerState.BUFFERING){player.pauseVideo()}
    else{player.playVideo()}
  });
  prevBtn.addEventListener("click",function(){if(ready)player.previousVideo()});
  nextBtn.addEventListener("click",function(){if(ready)player.nextVideo()});
  muteBtn.addEventListener("click",function(){
    if(!ready)return;
    var m=player.isMuted();
    if(m){player.unMute()}else{player.mute()}
    app.classList.toggle("is-muted",!m);
    muteBtn.setAttribute("aria-label",m?"Mute":"Unmute");
  });

  function seekFromEvent(ev){
    if(!ready)return;
    var r=bar.getBoundingClientRect();
    var x=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;
    var pct=Math.min(1,Math.max(0,x/r.width));
    var d=player.getDuration();
    if(d>0){player.seekTo(d*pct,true);fill.style.width=(pct*100)+"%"}
  }
  bar.addEventListener("pointerdown",function(ev){
    seekFromEvent(ev);
    var move=function(e){seekFromEvent(e)};
    var up=function(){window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up)};
    window.addEventListener("pointermove",move);
    window.addEventListener("pointerup",up);
  });
  bar.addEventListener("keydown",function(ev){
    if(!ready)return;
    if(ev.key==="ArrowRight"){player.seekTo(player.getCurrentTime()+5,true)}
    if(ev.key==="ArrowLeft"){player.seekTo(Math.max(0,player.getCurrentTime()-5),true)}
  });
})();
</script>
</body>
</html>
